name: deterministic-tests
on: [push, pull_request, workflow_dispatch]
jobs:
  deterministic:
    strategy:
      matrix:
        # ubuntu-latest is now 26.04, which Playwright 1.56 cannot install Chromium on.
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.0'
          python-version: '3.11'
      - run: uv sync --locked --extra llm --extra web --extra mcp
      - uses: actions/cache@v4
        with:
          path: |
            data/ephe
            data/geo
            data/unihan
          key: deterministic-data-${{ hashFiles('scripts/data_manifest.yaml') }}
      - run: uv run python -m scripts.fetch_data
      - run: uv run python -m knowledge.build
      - run: uv run python -m scripts.doctor
      - run: uv run ruff check harness agents common plugins knowledge memory signals scripts tests app.py cli.py web.py evals mcp_server
      - run: uv run ruff format --check harness agents common plugins knowledge memory signals scripts tests app.py cli.py web.py evals mcp_server
      # Browser regressions (tests/web/test_web_browser.py) run on Linux; elsewhere they skip.
      - if: runner.os == 'Linux'
        run: uv run playwright install --with-deps chromium
      - run: uv run --extra web --extra mcp pytest -q
