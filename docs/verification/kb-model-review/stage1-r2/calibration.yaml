      relationship: -0.1
      finance: -0.1
    text: 比肩是相对日主的传统关系标签，主题是独立与同伴：明确自己的职责，也给同伴协作空间。感情方面重视平等与独立，也容易各自坚持，宜留出协商空间；财务方面同伴分担也分享，留意合伙分配。传统上配偶星按性别区分，这里只作不分性别的倾向参考。在时柱可作为该柱位置的反思线索，不能代替全局分析。
    source: 自写草稿；参考《渊海子平》《三命通会》传统术语，未复制原文；感情、财务方向由 Anthropic Claude 于2026-10-21按传统规则起草；待人工审核
