    before: 天干冲是传统命理中对特定天干之间对立关系的称呼。本条采用甲庚、乙辛、丙壬、丁癸四组相冲的常见口径：在传统五行与方位对应中，这些组合涉及东西或南北方向相对，以及金克木、水克火。白话说，“冲”强调两端相对、难以协调的张力，并常被赋予变动、调整的象征意义。它的对象是天干，不是地支；也不同于强调配合、牵连的天干合。不同流派对天干冲的采用和解释存在差异。这里仅将其作为反思自身取向、做事方式与协调空间的文化隐喻，不据此判断现实中的吉凶或成败。
