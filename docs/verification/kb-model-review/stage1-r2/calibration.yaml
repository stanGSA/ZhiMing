    text: 三会是传统干支体系中，代表同一季节的三个地支组合在一起、被视为相应五行之气会聚的关系：寅卯辰对应春季，会木；巳午未对应夏季，会火；申酉戌对应秋季，会金；亥子丑对应冬季，会木。白话说，就是把同一季节的三个地支看作一组，强调某种力量的集中。它与三合的区别在于：三会按同一季节组合，三合则按五行生长、旺盛、收藏三个阶段组合。这里的“力量”是传统象征说法，不表示现实中一定有利或不利，也不能据此判断个人、事业、关系或财务的结果。本条只介绍组合含义，不判断具体情况下是否满足形成相应五行格局的条件。
    source: 自写草稿；参考《渊海子平》《三命通会》传统术语，未复制原文；待人工审核
