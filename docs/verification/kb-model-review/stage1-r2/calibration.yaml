- id: cal-bazi-h01
  system: bazi
  partition: holdout
  label: fail
  case: defect
  base: kb:bazi:branch:卯
  defect:
    type: not_object_specific
    detail: 只有通用说明，没有写出卯本身的核心信息，换成同类其他对象也同样成立
  change:
    field: text
    before: 在传统干支体系中，卯是十二地支之一，五行属木，藏干为乙（乙也属木）。“藏干”指传统上归入某个地支之中的天干。按地支本身所属五行计数时，每出现一个卯，就记作一个木；列出卯所藏的乙，则是在说明其内部归属，并不是额外多出一个地支。这是两种不同的信息口径，不宜混合重复计数。五行出现的数量不能直接用来判断其强弱（传统术语称“旺衰”），也不能据此认定哪些五行有利或适合用来调和（涉及“喜用神”的传统判断）。这些分类不代表个人性格、事业、关系或财务结果。
    after: 卯是十二地支之一，属于传统干支体系的基本单位。地支的五行与藏干按传统表确定，五行数量不能直接决定旺衰。这些属性属于传统文化分类，不代表个人能力或生活结果的好坏。
  rationale: 由现行条目改出一处缺陷（锚点C），其余内容不变；按规则应判 revise 或 reject。
