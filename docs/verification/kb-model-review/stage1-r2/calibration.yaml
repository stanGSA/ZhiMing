    text: 以下说法均为传统象征联想，不表示现实中更容易获得机会或收入。按传统十神定义，与日主五行相同且阴阳相同的天干关系称为比肩。比肩是相对日主的传统关系标签，主题是独立与同伴：明确自己的职责，也给同伴协作空间。感情方面重视平等与独立，也容易各自坚持，宜留出协商空间；财务方面同伴分担也分享，留意合伙分配。传统上配偶星按性别区分，这里只作不分性别的倾向参考。在月柱可作为该柱位置的反思线索，不能代替全局分析。
