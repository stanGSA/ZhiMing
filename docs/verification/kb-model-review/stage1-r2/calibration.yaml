    text: 本项目采用的相刑成员为子卯、寅巳、巳申、申寅、丑戌、戌未、未丑；辰、午、酉、亥各自重复为自刑。地支刑是传统命理中特定地支之间的相刑关系，并非泛指天干、地支之间的关系。白话说，它常被用来象征相互牵制、反复摩擦或内在纠结；与“冲”侧重对立变动、“害”侧重暗中不协调、“破”侧重原有配合受损相比，“刑”更强调约束与拧巴。这些只是传统解释的侧重点，不是现实结果的判定。用于自我反思时，可提醒留意自我苛责、反复纠结；用于工作反思时，可提醒检查规则约束、协作摩擦是否增加了推进阻力。“刑”不等于刑罚或灾祸，也不能据此推断关系破裂、事业受挫或财务损失，仍需结合实际情况判断。
