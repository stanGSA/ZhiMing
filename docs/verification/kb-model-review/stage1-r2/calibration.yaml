  change:
    field: text
    before: 天干合是传统干支体系中特定天干之间的五种配对关系，也称“天干五合”：甲己合、乙庚合、丙辛合、丁壬合、戊癸合。白话说，就是传统上将这五组天干视为彼此联结的组合，可借此思考配合、协调，也可留意牵绊或相互制约，并非有“合”就一定有利。“相合”与“合化”不是一回事：相合指上述配对关系；合化则指传统上在一定条件下，将相合组合按另一种五行性质来论述，不能见合就认定已化。本条不判定是否合化，也不据此预测性格、关系或事情成败。
    after: 天干合是传统干支体系中的一种关系，需结合具体干支判断。它属于传统文化中的分类，不代表现实中的吉凶，也不能据此判断个人、事业、关系或财务的结果。
