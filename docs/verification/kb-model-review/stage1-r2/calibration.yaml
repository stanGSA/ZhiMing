    text: 三合是传统干支体系中特定三个地支形成的组合：申子辰合木局、亥卯未合木局、寅午戌合火局、巳酉丑合金局。白话说，传统上把这些组合解释为三方围绕同一种五行属性会聚，并非任意三个地支都算三合。它不同于两个地支配对的“六合”，也不同于同一季节三个地支相聚的“三会”。三合不表示一概有利，也不保证合作顺利或事情成功；可借此反思多方如何协调、共同目标是否清晰。本条不判断组合是否满足传统所说的五行转化条件。
