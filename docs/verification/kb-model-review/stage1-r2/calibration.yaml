    text: 寅是十二地支之一，在传统干支体系中属火，藏干为甲、丙、戊，分别对应木、火、土。“藏干”指传统上认为地支中所包含的天干。按地支本身的五行属性统计数量时，寅计入木；分析藏干时，则另外考察甲、丙、戊所代表的五行，两者是不同的观察口径，不宜混为简单加总。五行出现的数量不能直接决定其强弱（传统术语称“旺衰”），也不能单凭数量判断哪些五行被认为有助于整体平衡（涉及“喜用神”的判断）。这些属于传统命理的解释框架，不代表对个人性格、际遇或吉凶的确定结论。
    source: 自写草稿；参考《渊海子平》《三命通会》传统术语，未复制原文；待人工审核
