# ACME bootstrap for this domain only. Existing default vhost stays intact.
server {
    listen 80;
    listen [::]:80;
    server_name zhiming.mom;
    server_tokens off;
    access_log /var/log/nginx/zhiming-domain-access.log;
    error_log /var/log/nginx/zhiming-domain-error.log warn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/zhiming-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        default_type text/plain;
        return 503 "ZhiMing HTTPS setup in progress.\n";
    }
}
