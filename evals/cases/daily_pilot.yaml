version: 1
status: draft_needs_review
scope: >-
  每日运势流水线（根因整改计划 P2.3）的调参集：当前 single 与 pipeline 用同一批题、同一 rubric v2、同一评委、
  各3次重复比较。每题带一份已保存的合成出生资料（profile），代表用户之前已在出生表单填写过；资料缺失或未确认的
  情形按负责人决定由 agent 循环处理，不在本集。题型覆盖今天、明天、指定日期、具体生活面向、幸运色、出生时间未知
  和高风险追问；只用于 P2 期间的对照与调整，最终验收用 daily_final.yaml。跑法：python -m scripts.live_week23
  --dataset evals/cases/daily_pilot.yaml --judge pro --repeats 3 --mode single。
