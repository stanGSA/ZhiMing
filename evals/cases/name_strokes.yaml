dataset: name_strokes
version: 1
purpose: 姓名五格的康熙笔画测试：100 个常见姓氏用字 + 100 个常见名字用字，覆盖部首还原、数字、姓氏繁体惯例等规则
generated_with:
  source: Unicode Unihan 18.0（unicode-org/unicodetools 仓库）：kTraditionalVariant、kRSUnicode、kTotalStrokes、kKangXi
  rule: 康熙笔画 = 部首原字笔画 + 余笔；数字一至十按数值；姓氏繁体按姓氏惯例覆盖
  cross_check: 与 37 个公认常见姓氏五格笔画比对：37/37 一致
summary:
  items: 200
  auto_ok: 181
  needs_review: 19
how_to_use: [auto_ok：规则计算结果，可直接作为期望值。, needs_review：存在繁体写法歧义或流派差异；评估时期望行为是工具给出默认值并在 notes 里提示，或通过 ask_user 让用户确认写法。上线前请人工对照康熙字典定稿。, 五格笔画本身是民间约定，不同书籍对少数字有分歧；本数据集的标准答案就是上面这条规则，项目实现若采用别的约定，需要同步修改。]
