dataset: bazi_boundary
version: 1
purpose: 八字排盘的边界测试：立春换年、节气换月、子时归属、真太阳时、1986–1991 夏令时、农历闰月输入、春节与立春错位、时辰未知
generated_with:
  reference: lunar_python（6tail/lunar-python，MIT）
  cross_check: [独立实现：年柱/月柱由太阳视黄经（Swiss Ephemeris）判断，日柱由儒略日数计算，时柱用五鼠遁，十神按五行生克规则推导, 节气时刻：lunar_python 与 Swiss Ephemeris 各算一次并记录差值, 闰月：用 Swiss Ephemeris 求朔日与中气，验证农历月初一与闰月判定]
  time: 钟表时间 → IANA 时区 Asia/Shanghai（含 1986–1991 夏令时）→ 北京标准时 UTC+8；开启真太阳时的用例再做经度与均时差修正
conventions:
  zishi_rule: 默认 next_day（23:00 起换日）；标注 both 的用例同时给出 same_day 结果
  true_solar_time: 真太阳时 = 北京标准时 + (经度 − 120°) × 4 分钟 + 均时差；所有柱都用修正后的时间
  dayun: 大运用 lunar_python 默认起运算法；不同流派起运岁数可能相差数月，测试时只比较本项目选定的流派
  ten_gods: 只列年、月、时三柱天干相对日主的十神
summary:
  cases: 50
  independent_pillar_agreement: 55/55
  independent_ten_gods_agreement: 55/55
  max_solar_term_diff_seconds_lunar_python_vs_swiss_ephemeris: 2.3
notes: [出生数据均为合成数据。, 节气边界用例与节气时刻至少相隔 10 分钟，远大于两种算法的节气时刻差，因此标准答案不受算法差异影响。, “权威万年历人工核对”这一步仍建议做：抽 10 条与纸质或权威网站万年历比对。]
