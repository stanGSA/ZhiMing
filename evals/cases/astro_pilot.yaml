version: 1
status: draft_needs_review
scope: >-
  星盘流水线（根因整改计划 P3，负责人 2026-11-07 决定照 P2 组织）的调参集：当前 single 与 pipeline 用同一批题、
  同一 rubric v2、同一评委、各3次重复比较。每题带一份已保存的合成出生资料（profile），代表用户之前已在出生表单
  填写过。题型覆盖本命性格、下个月时机、海外出生且未说明现居地（按负责人口径默认出生地时区并注明）、出生时间
  未知、时间范围不清需追问一次、高风险投资。只用于 P3 期间的对照与调整，最终验收用 astro_final.yaml。跑法：
  python -m scripts.live_week23 --dataset evals/cases/astro_pilot.yaml --judge pro --repeats 3 --mode single。
