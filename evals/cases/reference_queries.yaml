optional: true
purpose: 参考文本 RAG（第 7 周可选）的检索评估：Recall@3
how_to_use: [参考文本库还没建，因此 relevant_passage_ids 留空；expected_topics 同时是参考文本库的选题清单。, 建库后为每条查询标注 1–3 个相关段落 id，再计算 Recall@3。, 检索时必须带上 system 分区过滤（与专家权限一致）。]
