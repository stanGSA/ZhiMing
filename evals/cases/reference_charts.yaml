dataset: reference_charts
version: 1
purpose: 西方占星排盘的确定性测试：行星黄经、星座、逆行、Placidus 宫位、上升/天顶、主要相位
generated_with:
  reference: Swiss Ephemeris（aloistr/swisseph，SE 星历文件 sepl_18.se1 / semo_18.se1）
  cross_check: 行星：同一库的 Moshier 解析星历（独立理论）；宫位：独立实现的 MC / 上升 / Placidus（Porphyry）公式
  frame: 地心、视位置、回归黄道（tropical）
  time: 本地时间按 IANA 时区换算为 UT（Python zoneinfo）
tolerance:
  planet_lon_deg: 0.01
  cusp_deg: 0.01
aspect_orbs_deg:
  conjunction: 8
  opposition: 8
  trine: 8
  square: 7
  sextile: 5
notes: [出生数据为合成数据，不对应真实人物：星历精度测试与输入是谁无关，用合成数据可避免处理真实个人信息。, 相位容许度是本数据集的约定，项目若改用其他容许度，需要重新生成 aspects 字段。, 计划中写的是用 Skyfield 交叉验证；生成本文件的环境无法下载 JPL 星历，因此改用 SE 文件 vs Moshier。项目环境就绪后，建议在
    tests/ 中再加一道 Skyfield 校验。]
