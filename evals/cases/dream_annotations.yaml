dataset: dream_annotations
version: 1
status: draft_needs_review
purpose: 解梦意象匹配评估：意象抽取与归一的准确率 / 召回率、词典外意象的未命中处理、无依据解读率
how_to_score:
  match: 把 LLM 抽取并经 lookup_dream_symbols 命中的意象集合与 gold_symbols 比较，计算 precision / recall
  alternatives: 若输出与 acceptable_alternative 完全一致，也按满分计
  oov: out_of_vocabulary 中的意象必须出现在工具的未命中列表里，且最终解读不得对其作出含义解释
  emotion: emotion 字段供解读质量评审使用，不参与匹配打分
vocabulary_used:
  note: 本数据集用到的标准意象 key；知识库的 300 条解梦意象应覆盖这些 key，并为每条维护同义词表
