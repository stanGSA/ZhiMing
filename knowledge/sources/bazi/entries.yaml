- id: kb:bazi:convention:day_master
  system: bazi
  kind: convention
  key: day_master
  synonyms: []
  keywords:
  - day_master
  theme_map:
    self: 0.0
    career: 0.0
  text: 日主是日柱的天干，五行随该天干主五行确定；十神均相对这个日主计算。日主标签不表示已知人格或职业能力。
  source: 自写草稿；参考《渊海子平》《三命通会》传统术语，未复制原文；待人工审核
  license: 本项目自写
  reviewed: false
  version: 2
- id: kb:bazi:convention:dayun
  system: bazi
  kind: convention
  key: dayun
  synonyms: []
  keywords:
  - dayun
  theme_map:
    self: 0.0
    career: 0.0
  text: 大运采用lunar_python getYun流派1：阳年男、阴年女顺排，阴年男、阳年女逆排；顺取出生到下一个节、逆取上一个节到出生的间隔，按三天折一年、时辰差折算月日，约每十年换一运。首运从月柱按顺逆移动一位。起运日期、年龄和序列以工具结果为准，不代表现实事件发生日期；其他流派可能不同。
  source: 自写草稿；参考《渊海子平》《三命通会》传统术语，未复制原文；待人工审核
  license: 本项目自写
  reviewed: false
  version: 2
- id: kb:bazi:convention:true_solar_time
  system: bazi
  kind: convention
  key: true_solar_time
  synonyms: []
  keywords:
  - true_solar_time
  theme_map:
    self: 0.0
    career: 0.0
  text: 真太阳时为北京时间固定UTC+8加(经度−120度)×4分钟，再加视太阳时减平太阳时的均时差；日时可能跨界，节气边界仍是物理时刻。关闭时先修正历史夏令时，再用北京时间。
  source: 自写草稿；参考《渊海子平》《三命通会》传统术语，未复制原文；待人工审核
  license: 本项目自写
  reviewed: false
  version: 2
- id: kb:bazi:convention:unknown_time
  system: bazi
  kind: convention
  key: unknown_time
  synonyms: []
  keywords:
  - unknown_time
  theme_map:
    self: 0.0
    career: 0.0
  text: 出生时辰未知只能提供能确定的三柱，时柱与精确起运不可用；出生日期跨节气或真太阳时可能跨日时须先追问，仍未知则展示候选并标明不确定性。
  source: 自写草稿；参考《渊海子平》《三命通会》传统术语，未复制原文；待人工审核
  license: 本项目自写
  reviewed: false
  version: 2
- id: kb:bazi:convention:year_month_boundary
  system: bazi
  kind: convention
  key: year_month_boundary
  synonyms: []
  keywords:
  - year_month_boundary
  theme_map:
    self: 0.0
    career: 0.0
  text: 以立春的实际时刻换年，以十二节的实际时刻换月，不以春节、农历初一或公历月初换柱。
  source: 自写草稿；参考《渊海子平》《三命通会》传统术语，未复制原文；待人工审核
  license: 本项目自写
  reviewed: false
  version: 2
- id: kb:bazi:convention:zishi_next_day
  system: bazi
  kind: convention
  key: zishi_next_day
  synonyms: []
  keywords:
  - zishi_next_day
  theme_map:
    self: 0.0
    career: 0.0
  text: 23:00起日柱换为次日，子时天干由次日日干推算；年柱月柱仍按实际节气时刻，不随日柱换日。
  source: 自写草稿；参考《渊海子平》《三命通会》传统术语，未复制原文；待人工审核
  license: 本项目自写
  reviewed: false
  version: 2
- id: kb:bazi:convention:zishi_same_day
  system: bazi
  kind: convention
  key: zishi_same_day
  synonyms: []
  keywords:
  - zishi_same_day
  theme_map:
    self: 0.0
    career: 0.0
  text: 区分早晚子时：23–24点日柱属于当天，时柱用次日日干起子时；0–1点为当天早子时。
  source: 自写草稿；参考《渊海子平》《三命通会》传统术语，未复制原文；待人工审核
  license: 本项目自写
  reviewed: false
  version: 2
