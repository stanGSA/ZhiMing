  system: bazi
  kind: element
  key: 土
  synonyms: []
  keywords:
  - 土
  theme_map:
    self: 0.0
    career: 0.0
  text: 五行土的出现次数只说明本工具的简单计数，需结合节气与藏干理解，不能据此断言需要补某五行。
