mode: single                # single | multi；第4周关口通过前默认仍为 single
llm:
  provider: deepseek
  model: deepseek-flash
  timeout_s: 90
  system_role: system
  deepseek:
    thinking: disabled
models:
  orchestrator: deepseek-flash
  specialist: deepseek-flash
  reviewer: deepseek-flash
model_options:
  orchestrator:
    max_tokens: 8192
  specialist:
    max_tokens: 4096
  reviewer:
    max_tokens: 2048
limits:
  specialist_mode: agent      # agent | lite；对照实验前保持默认
  orchestrator_max_steps: 12
  request_token_budget: 180000
  request_timeout_s: 300
  specialist_max_steps: 6
  specialist_token_budget: 40000
  specialist_timeout_s: 120
  orchestrator_reserve_tokens: 30000
  max_parallel_specialists: 3
  reviewer_max_steps: 3
  reviewer_token_budget: 12000
  reviewer_timeout_s: 60
reviewer:
  enabled: true               # 只在 multi 模式生效；single 模式是对照基线，不审校
  strictness: lenient         # lenient | strict | off（对照实验用）
  max_rounds: 1
safety:
  region: null               # 按咨询时区→出生时区选择地区；均未填写时不猜地区
  # 官方来源与核实日期：2026-10-20；详见 docs/verification/stage0/hotlines.md
  # 国家卫健委通知：https://www.gov.cn/zhengce/zhengceku/202412/content_6994470.htm
  # 美国988官方：https://988lifeline.org/get-help/what-to-expect/
  emergency_contacts:
    CN: [中国大陆急救120, 中国大陆报警110]
    US: [美国紧急服务911]
  psychological_contacts:
    CN: [中国大陆全国统一心理援助热线12356（各地服务时间可能不同）]
    US: [美国988自杀与危机生命线（拨打或发短信988）]
kb_review:                    # 知识库模型交叉审核（scripts.model_review_kb）；不是人工审核
  timeout_s: 120
  # 总预算由所有 run / revise / 续跑共享；失败、缺失 usage 和重试保留保守预留。
  # 金额按确认的单价估算，不等于服务账单；所有角色须提供同币种单价。
  # 确认后填：{limit: <总额>, currency: <币种>, state_path: docs/verification/kb-model-review/<本次会话>/budget.json}
  budget:
    unlimited: true  # 2026-10-21 项目负责人明确回复“没有预算上限”；费率未知不填成0。
    state_path: docs/verification/kb-model-review/20261021-live/budget.json
  # 两家审核方须为不同厂商，且都不能与运行时模型（llm.provider）同一厂商；修改方不能与审核方同厂商。
  # 待项目负责人确认厂商与模型后填写，例如：
  # reviewer_a: {vendor: <厂商>, api: openai, model: <模型名>, api_key_env: <密钥环境变量名>,
  #              base_url: <兼容接口地址>, input_per_mtok: <每百万输入token单价>, output_per_mtok: <单价>, currency: USD}
  # api 为 openai（任何兼容 OpenAI 的接口）或 anthropic。密钥只从环境变量读取，不写入任何文件。
  # 起草条目内容的厂商，审核方不能与之同厂商（4.3）：阶段1 B1 的感情、财务方向与对应文字由
  # Anthropic Claude 起草；更早草稿的起草模型没有记录。
  drafter_vendors: [anthropic]
  # 2026-10-22 项目负责人在flash三轮试跑失败后，明确改用pro并沿用厂商例外；仅此模型放行。
  # 两家审核仍须不同厂商，且不能是起草方 Anthropic；不宣称符合原4.3的运行时独立性。
  runtime_vendor_exception:
    vendor: deepseek
    model: deepseek-v4-pro
    reason: 2026-10-22 项目负责人明确批准审核A改用deepseek-v4-pro，沿用已批准的DeepSeek厂商例外
  reviser_vendor_exception:
    vendor: openai
    model: gpt-6-astra
    reviewers:
      reviewer_a: {vendor: deepseek, model: deepseek-v4-pro}
      reviewer_b: {vendor: openai, model: gpt-6.1-sol}
    reason: 2026-10-21 项目负责人在知晓同厂商限制后明确要求第三方使用OpenAI
  # 第三方中转站地址不入库：reviewer_a从本机 .env 的 DEEPSEEK_BASE_URL 读取，
  # reviewer_b与reviser从 OPENAI_REVIEW_BASE_URL 读取；
  # 未设置时拒绝调用，不回退到官方地址（密钥属于该中转站）。2026-10-21 批次实际为 codegoai.com。
  roles:
    reviewer_a:
      vendor: deepseek
      api: openai
      model: deepseek-v4-pro
      thinking: enabled
      reasoning_effort: high
      max_tokens: 16384
      api_key_env: DEEPSEEK_API_KEY
      base_url_env: DEEPSEEK_BASE_URL
    reviewer_b:
      vendor: openai
      api: openai
      model: gpt-6.1-sol
      api_key_env: OPENAI_REVIEW_API_KEY
      base_url_env: OPENAI_REVIEW_BASE_URL
    reviser:
      vendor: openai
      api: openai
      model: gpt-6-astra
      api_key_env: OPENAI_REVIEW_API_KEY
      base_url_env: OPENAI_REVIEW_BASE_URL
kb:
  path: data/kb.sqlite
  dream_match_threshold: 0.75   # 解梦意象BM25候选的相似度阈值；首次评估后再调
paths:
  app_db: data/app.db
  runs: runs

eval_judges:
  pro:
    vendor: deepseek
    api: openai
    model: deepseek-v4-pro
    thinking: enabled
    reasoning_effort: high
    max_tokens: 8192
    api_key_env: DEEPSEEK_API_KEY
    base_url_env: DEEPSEEK_BASE_URL

policy_judge:
  enabled: false  # 校准报告完成前保留严格正则；可显式开启两级判定
  timeout_s: 30
