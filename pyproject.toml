[project]
name = "zhiming-agent"
version = "0.1.0"
description = "Tarot, astrology, bazi, name numerology, dream interpretation and daily fortune with a traceable agent harness"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "python-dotenv>=1,<2",
  "httpx>=0.28,<1",
  "tenacity>=9,<10",
  "typer>=0.16,<1",
  "rich>=13,<15",
  "tzdata>=2026.1,<2027",
  "pyswisseph==2.10.3.2",
  "skyfield>=1.54,<2",
  "lunar-python>=1.4.8,<2",
]

[project.optional-dependencies]
llm = ["openai>=1.90,<3", "anthropic>=0.60,<1"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
# FastMCP lives in mcp 1.x; mcp 2 renamed it (MCPServer) and changed the API.
mcp = ["mcp>=1.30.0,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.12,<1", "playwright>=1.56,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "agents", "common", "plugins", "knowledge", "memory", "signals", "evals", "scripts", "mcp_server", "ops"]

[tool.hatch.build.targets.wheel.force-include]
"app.py" = "app.py"
"cli.py" = "cli.py"
"web.py" = "web.py"
"web_static" = "web_static"
"config.yaml" = "config.yaml"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["evals/generators"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
