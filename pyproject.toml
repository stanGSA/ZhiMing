[project]
name = "zhiming-agent"
version = "0.1.0"
description = "A deterministic tarot plugin and a small, traceable agent harness"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.10,<3", "pyyaml>=6,<7", "python-dotenv>=1,<2",
  "httpx>=0.28,<1", "tenacity>=9,<10", "typer>=0.16,<1", "rich>=13,<15",
  "tzdata>=2026.1,<2027",
]

[project.optional-dependencies]
llm = ["openai>=1.90,<3", "anthropic>=0.60,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["evals/generators"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
